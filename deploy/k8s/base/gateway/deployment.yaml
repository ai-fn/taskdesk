apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: todo
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: gateway
        # Tilt manages this image tag during live development.
        # For manual builds: docker build -t todo/gateway -f services/gateway/Dockerfile .
        image: todo/gateway
        imagePullPolicy: IfNotPresent
        env:
        - name: LISTEN_ADDR
          value: ":8080"
        - name: LOG_LEVEL
          value: "info"
        - name: AUTH_ADDR
          value: "auth.todo.svc.cluster.local:50051"
        - name: TODO_ADDR
          value: "todo.todo.svc.cluster.local:50052"
        - name: AI_ADDR
          value: "ai.todo.svc.cluster.local:50054"
        - name: REDIS_ADDR
          value: "redis.data.svc.cluster.local:6379"
        - name: COOKIE_SECURE # "true" behind TLS; also implied by an https OAUTH_BASE_URL
          value: "false"
        - name: OAUTH_BASE_URL
          valueFrom:
            secretKeyRef:
              name: gateway-secret
              key: OAUTH_BASE_URL
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: gateway-secret
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: gateway-secret
              key: GOOGLE_CLIENT_SECRET
        - name: DISCORD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: gateway-secret
              key: DISCORD_CLIENT_ID
        - name: DISCORD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: gateway-secret
              key: DISCORD_CLIENT_SECRET
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 1
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          # readOnlyRootFilesystem omitted in base: Tilt's restart_process
          # extension writes to /tmp. Add it back in the prod overlay (Phase 5)
          # with an emptyDir tmpfs mount.
