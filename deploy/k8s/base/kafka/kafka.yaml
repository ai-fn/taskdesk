# Single-broker Kafka via Strimzi — sized for kind, NOT production.
#
# Strimzi operator must already be installed in the `data` namespace; the
# kind-up.sh script does that before applying this manifest.
#
# Resource sizes are aggressive on purpose: a default Strimzi cluster wants
# multiple GiB and will starve a kind node. We trade durability (single
# replica, ephemeral storage) for being able to run Kafka on a laptop.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: todo
  namespace: data
spec:
  kafka:
    version: 3.7.0
    replicas: 1
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      inter.broker.protocol.version: "3.7"
    storage:
      type: ephemeral
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 1Gi
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral
    resources:
      requests:
        memory: 256Mi
        cpu: 50m
      limits:
        memory: 512Mi
  entityOperator:
    topicOperator: {}
    userOperator: {}
