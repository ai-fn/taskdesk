# Single-broker Kafka via Strimzi in KRaft mode — sized for kind, NOT production.
#
# KRaft removes ZooKeeper entirely. Controller + broker roles run in the same
# pod via a KafkaNodePool (dual-role). This eliminates the ZooKeeper
# CrashLoopBackOff that plagued the single-replica ephemeral ZK setup.
#
# StatefulSet name: todo-dual-role  (was: todo-kafka + todo-zookeeper)
# Pod name:         todo-dual-role-0
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: data
  labels:
    strimzi.io/cluster: todo
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: todo
  namespace: data
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false # topics come from topics.yaml; a typo must fail, not create a stray topic
  entityOperator:
    topicOperator: {}
    userOperator: {}
