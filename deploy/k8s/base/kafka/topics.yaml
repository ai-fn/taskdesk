apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: auth-email-v1
  namespace: data
  labels:
    strimzi.io/cluster: todo
spec:
  topicName: auth.email.v1
  partitions: 3
  replicas: 1
  config:
    retention.ms: "86400000"    # 1 day (OTP codes expire fast)
    segment.bytes: "104857600"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: task-events-v1
  namespace: data
  labels:
    strimzi.io/cluster: todo
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"   # 7 days
    segment.bytes: "104857600"  # 100 MiB
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: daily-plan-generated-v1
  namespace: data
  labels:
    strimzi.io/cluster: todo
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"   # 7 days
    segment.bytes: "104857600"  # 100 MiB
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: auth-email-v1-dlq
  namespace: data
  labels:
    strimzi.io/cluster: todo
spec:
  topicName: auth.email.v1.dlq
  partitions: 1
  replicas: 1
  config:
    retention.ms: "86400000"    # 1 day, same as the source: payload carries OTP codes
    segment.bytes: "104857600"
    max.message.bytes: "2097152"  # source record plus DLQ headers must fit
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: task-events-v1-dlq
  namespace: data
  labels:
    strimzi.io/cluster: todo
spec:
  topicName: task.events.v1.dlq
  partitions: 1
  replicas: 1
  config:
    retention.ms: "1209600000"  # 14 days: dead letters need human triage
    segment.bytes: "104857600"
    max.message.bytes: "2097152"  # source record plus DLQ headers must fit
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: daily-plan-generated-v1-dlq
  namespace: data
  labels:
    strimzi.io/cluster: todo
spec:
  topicName: daily-plan.generated.v1.dlq
  partitions: 1
  replicas: 1
  config:
    retention.ms: "1209600000"  # 14 days: dead letters need human triage
    segment.bytes: "104857600"
    max.message.bytes: "2097152"  # source record plus DLQ headers must fit
