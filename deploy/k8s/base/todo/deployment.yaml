apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: todo
          image: todo/todo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          env:
            - name: LISTEN_ADDR
              value: ":50052"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DATABASE_URL
            - name: DB_MAX_CONNS
              value: "20"
            - name: MIGRATIONS_DIR
              value: "file:///migrations/todo"
            - name: BLOB_ENDPOINT
              value: "http://minio.data.svc.cluster.local:9000"
            - name: BLOB_REGION
              value: "auto"
            - name: BLOB_BUCKET
              value: "attachments"
            - name: BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-secret
                  key: BLOB_ACCESS_KEY
            - name: BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-secret
                  key: BLOB_SECRET_KEY
            # Browser-reachable MinIO (scripts/port-forwards.sh); presigned URLs are signed for this host.
            - name: BLOB_PUBLIC_ENDPOINT
              value: "http://localhost:9000"
            - name: BLOB_BOOTSTRAP
              value: "true"
            - name: BLOB_CORS_ORIGINS
              value: "http://localhost:8080,http://localhost:5173"
            - name: BLOB_REGION_LABEL
              value: "local"
          volumeMounts:
            - name: migrations
              mountPath: /migrations/todo
              readOnly: true
          readinessProbe:
            grpc:
              port: 50052
              service: readiness
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: migrations
          configMap:
            name: todo-migrations
