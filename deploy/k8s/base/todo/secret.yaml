apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:devpassword@postgres.data.svc.cluster.local:5432/todo?sslmode=disable&x-migrations-table=todo_schema_migrations"
---
# Dev-only MinIO credentials shared by todo and notification; must match minio-secret in the data namespace.
apiVersion: v1
kind: Secret
metadata:
  name: blob-secret
  namespace: todo
type: Opaque
stringData:
  BLOB_ACCESS_KEY: todo-dev
  BLOB_SECRET_KEY: todo-dev-secret-key
