apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: notification
          image: todo/notification
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: "todo-kafka-bootstrap.data.svc.cluster.local:9092"
            - name: KAFKA_GROUP
              value: "notification-service"
            - name: REDIS_ADDR
              value: "redis.data.svc.cluster.local:6379"
            - name: SMTP_ADDR
              value: "mailpit.data.svc.cluster.local:1025"
            - name: SMTP_FROM
              value: "noreply@todo.local"
            - name: TODO_ADDR
              value: "todo.todo.svc.cluster.local:50052"
            - name: BLOB_ENDPOINT
              value: "http://minio.data.svc.cluster.local:9000"
            - name: BLOB_BUCKET
              value: "attachments"
            - name: BLOB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-secret
                  key: BLOB_ACCESS_KEY
            - name: BLOB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-secret
                  key: BLOB_SECRET_KEY
            - name: CLAMAV_ADDR
              value: "clamav.data.svc.cluster.local:3310"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SMTP_PASS
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
