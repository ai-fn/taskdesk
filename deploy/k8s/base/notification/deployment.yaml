apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: notification
          image: todo/notification
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: "todo-kafka-bootstrap.data.svc.cluster.local:9092"
            - name: KAFKA_GROUP
              value: "notification-service"
            - name: KAFKA_AUTH_GROUP
              value: "notification-auth"
            - name: REDIS_ADDR
              value: "redis.data.svc.cluster.local:6379"
            - name: SMTP_ADDR
              value: "mailpit.data.svc.cluster.local:1025"
            - name: SMTP_FROM
              value: "noreply@todo.local"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SMTP_PASS
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
