apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo
resources:
  - deployment.yaml
# Secret generated from local .env (gitignored).
# Copy .env.example → .env and fill in SMTP credentials before `tilt up`.
secretGenerator:
  - name: notification-secret
    envs:
      - .env
generatorOptions:
  disableNameSuffixHash: true
