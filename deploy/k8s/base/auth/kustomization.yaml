apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo
resources:
  - deployment.yaml
  - service.yaml
  - secret.yaml
# Stripe secrets generated from local .env (gitignored).
# Copy .env.example → .env and fill in values before `tilt up`.
secretGenerator:
  - name: auth-stripe-secret
    envs:
      - .env
configMapGenerator:
  - name: auth-migrations
    files:
      - 000001_init.up.sql
      - 000001_init.down.sql
      - 000002_oauth.up.sql
      - 000002_oauth.down.sql
      - 000003_sessions.up.sql
      - 000003_sessions.down.sql
      - 000004_user_language.up.sql
      - 000004_user_language.down.sql
      - 000005_email_verify.up.sql
      - 000005_email_verify.down.sql
      - 000006_subscription_plan.up.sql
      - 000006_subscription_plan.down.sql
      - 000007_subscriptions.up.sql
      - 000007_subscriptions.down.sql
      - 000008_promo_codes.up.sql
      - 000008_promo_codes.down.sql
      - 000009_subscriptions_source_ref_unique.up.sql
      - 000009_subscriptions_source_ref_unique.down.sql
      - 000010_users_stripe_customer_index.up.sql
      - 000010_users_stripe_customer_index.down.sql
      - 000011_users_email_lower_index.up.sql
      - 000011_users_email_lower_index.down.sql
      - 000012_users_email_lowercase.up.sql
      - 000012_users_email_lowercase.down.sql
generatorOptions:
  disableNameSuffixHash: true
