# DATABASE_URL for the auth service.
# In dev, points at the shared Postgres in the data namespace.
# The JWT private key lives in a separate auth-jwt-key Secret generated by
# scripts/gen-jwt-key.sh on first cluster setup.
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: todo
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:devpassword@postgres.data.svc.cluster.local:5432/todo?sslmode=disable&x-migrations-table=auth_schema_migrations"
