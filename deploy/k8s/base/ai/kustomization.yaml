apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo
resources:
  - deployment.yaml
  - service.yaml
# Secret generated from local .env (gitignored).
# Copy .env.example → .env and fill in API keys before `tilt up`.
secretGenerator:
  - name: ai-secret
    envs:
      - .env
configMapGenerator:
  - name: ai-migrations
    files:
      - 000001_init.up.sql
      - 000001_init.down.sql
generatorOptions:
  disableNameSuffixHash: true
