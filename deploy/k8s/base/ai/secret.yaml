apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: todo
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:devpassword@postgres.data.svc.cluster.local:5432/todo?sslmode=disable&x-migrations-table=ai_schema_migrations"
  # ANTHROPIC_API_KEY is injected at dev time by Tiltfile from .env (gitignored).
  # It is intentionally absent here so kustomize does not reset it.
