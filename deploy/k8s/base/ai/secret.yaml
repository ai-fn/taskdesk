apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: todo
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:devpassword@postgres.data.svc.cluster.local:5432/todo?sslmode=disable&x-migrations-table=ai_schema_migrations"
  # Override ANTHROPIC_API_KEY via: kubectl -n todo create secret generic ai-secret --from-literal=ANTHROPIC_API_KEY=sk-ant-...
  ANTHROPIC_API_KEY: ""
