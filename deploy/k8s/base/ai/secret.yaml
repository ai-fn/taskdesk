apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: todo
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:devpassword@postgres.data.svc.cluster.local:5432/todo?sslmode=disable&x-migrations-table=ai_schema_migrations"
  # ANTHROPIC_API_KEY and VOYAGE_API_KEY are injected at dev time by Tiltfile
  # from .env (gitignored). They are intentionally absent here so kustomize
  # does not reset them.
