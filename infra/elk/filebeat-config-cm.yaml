apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: monitoring
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: kubernetes-containers
        paths:
          - /var/log/containers/*.log
        parsers:
          - container: {}
        prospector.scanner.symlinks: true

    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
      # Parse the JSON message our Go services emit and promote fields to root.
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: false
          add_error_key: false
      # Go slog emits `service: "auth"` but ECS maps `service` as an object.
      # Rename to service.name (ECS-compliant keyword) before indexing.
      - rename:
          fields:
            - from: service
              to: service.name
          ignore_missing: true
          fail_on_error: false
      # Drop noisy health-check spam from the log stream.
      # Only drop /healthz 200s from gateway — not ALL msg:http logs.
      - drop_event:
          when:
            or:
              # Gateway probe noise: msg=http + path=/healthz|/readyz + status=200 (failing /readyz stays visible)
              - and:
                - equals:
                    msg: "http"
                - or:
                  - equals:
                      path: "/healthz"
                  - equals:
                      path: "/readyz"
                - equals:
                    status: 200
              # ES initContainer sets vm.max_map_count — not a real service log.
              - equals:
                  kubernetes.container.name: "sysctl"

    output.elasticsearch:
      hosts: ["http://elasticsearch.monitoring.svc.cluster.local:9200"]
      index: "todo-logs-%{+yyyy.MM.dd}"
      # Filebeat 8.x defaults to data streams; disable for simple daily indices.
      data_stream.enabled: false

    # Disable ILM and data-stream template management entirely.
    setup.ilm.enabled: false
    setup.template.enabled: false

    logging.level: warning
    logging.to_stderr: true
