apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-http
  namespace: monitoring
data:
  gateway-http.json: |
    {
      "uid": "todo-http",
      "title": "Gateway HTTP",
      "tags": ["http", "gateway", "todo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "30s",
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Request Rate",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total[1m]))", "refId": "A"}],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background", "graphMode": "area"
          },
          "fieldConfig": {"defaults": {
            "unit": "reqps",
            "thresholds": {"mode": "absolute", "steps": [{"value": null, "color": "green"}]}
          }}
        },
        {
          "id": 2, "type": "stat", "title": "5xx Error Rate",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total{code=~\"5..\"}[1m]))", "refId": "A"}],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background", "graphMode": "area"
          },
          "fieldConfig": {"defaults": {
            "unit": "reqps",
            "thresholds": {"mode": "absolute", "steps": [
              {"value": null, "color": "green"},
              {"value": 0.01, "color": "yellow"},
              {"value": 0.1, "color": "red"}
            ]}
          }}
        },
        {
          "id": 3, "type": "stat", "title": "p99 Latency",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.99, sum by(le)(rate(http_duration_seconds_bucket[5m])))", "refId": "A"}],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background", "graphMode": "none"
          },
          "fieldConfig": {"defaults": {
            "unit": "s",
            "thresholds": {"mode": "absolute", "steps": [
              {"value": null, "color": "green"},
              {"value": 0.1, "color": "yellow"},
              {"value": 1, "color": "red"}
            ]}
          }}
        },
        {
          "id": 4, "type": "stat", "title": "Total Requests",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [{"expr": "sum(http_requests_total)", "refId": "A", "instant": true}],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "none", "graphMode": "none"
          },
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 5, "type": "timeseries", "title": "Request Rate by Path",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{"expr": "sum by(method, path)(rate(http_requests_total{path!=\"/healthz\"}[1m]))", "legendFormat": "{{method}} {{path}}", "refId": "A"}],
          "fieldConfig": {"defaults": {
            "unit": "reqps",
            "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 15, "gradientMode": "opacity"}
          }}
        },
        {
          "id": 6, "type": "timeseries", "title": "Status Code Distribution",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {"expr": "sum by(code)(rate(http_requests_total[1m]))", "legendFormat": "HTTP {{code}}", "refId": "A"}
          ],
          "fieldConfig": {"defaults": {
            "unit": "reqps",
            "custom": {"drawStyle": "bars", "fillOpacity": 80, "stacking": {"mode": "normal"}}
          }}
        },
        {
          "id": 7, "type": "timeseries", "title": "p99 Latency by Path",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{"expr": "histogram_quantile(0.99, sum by(path,le)(rate(http_duration_seconds_bucket{path!=\"/healthz\"}[5m])))", "legendFormat": "p99 {{path}}", "refId": "A"}],
          "fieldConfig": {"defaults": {
            "unit": "s",
            "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10}
          }}
        },
        {
          "id": 8, "type": "timeseries", "title": "p50 Latency by Path",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{"expr": "histogram_quantile(0.50, sum by(path,le)(rate(http_duration_seconds_bucket{path!=\"/healthz\"}[5m])))", "legendFormat": "p50 {{path}}", "refId": "A"}],
          "fieldConfig": {"defaults": {
            "unit": "s",
            "custom": {"drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 10}
          }}
        },
        {
          "id": 9, "type": "table", "title": "Top Paths by Volume",
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 20},
          "targets": [{"expr": "sort_desc(sum by(method, path, code)(http_requests_total{path!=\"/healthz\"}))", "refId": "A", "instant": true, "legendFormat": ""}],
          "options": {"sortBy": [{"displayName": "Value", "desc": true}]},
          "fieldConfig": {"defaults": {"unit": "short"}}
        }
      ]
    }
