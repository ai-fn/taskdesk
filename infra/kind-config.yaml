kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: todo
nodes:
- role: control-plane
  # Expose Caddy's NodePort to the host so `curl localhost:8080` reaches the
  # cluster. The Caddy Service in deploy/k8s/base/caddy/service.yaml binds to
  # nodePort 30080, which is what we forward to host port 8080 here.
  extraPortMappings:
  - containerPort: 30080
    hostPort: 8080
    protocol: TCP
  # Reserve 30443 for TLS in Phase 5; harmless to map now.
  - containerPort: 30443
    hostPort: 8443
    protocol: TCP
  # Tilt UI dashboard is served on the host directly (not via kind), so no
  # extra mapping needed for it.
