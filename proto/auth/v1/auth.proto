syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/fsociety/todo/proto/gen/auth/v1;authv1";

// AuthService handles user registration, authentication, and token management.
service AuthService {
  rpc SignUp(SignUpRequest)         returns (SignUpResponse);
  rpc Login(LoginRequest)          returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest)        returns (LogoutResponse);
  // GetJWKS returns the public keys used to verify access tokens.
  // Called by the gateway on startup and periodically to refresh keys.
  rpc GetJWKS(GetJWKSRequest)      returns (GetJWKSResponse);
  // ValidateToken verifies an access token and returns the embedded claims.
  // Gateway calls this on every authenticated request.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  // ValidateSession reports whether a session is still live (not revoked or expired).
  // The gateway's local verifier calls it, cached, so revocation reaches access tokens.
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  // ListUserIDs returns registered user IDs and emails, one page at a time.
  // Used by the scheduler to fan out daily-plan generation.
  rpc ListUserIDs(ListUserIDsRequest) returns (ListUserIDsResponse);
  // GetUserByID returns a single user's public profile.
  rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);
  // OAuthSignIn finds-or-creates a user from a verified OAuth identity and
  // returns a fresh token pair, exactly like Login/SignUp.
  rpc OAuthSignIn(OAuthSignInRequest) returns (OAuthSignInResponse);
  // ListSessions returns all active sessions for the authenticated user.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSession revokes a single session by ID (ownership-checked).
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // RevokeOtherSessions revokes all sessions except the current one.
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);
  // UpdateUserLanguage sets the user's preferred UI language.
  rpc UpdateUserLanguage(UpdateUserLanguageRequest) returns (UpdateUserLanguageResponse);
  // UpdateUserTimeZone sets the user's IANA time zone ("today" boundaries, plan timing).
  rpc UpdateUserTimeZone(UpdateUserTimeZoneRequest) returns (UpdateUserTimeZoneResponse);
  // RequestPasswordReset sends a one-time code to the user's email.
  // Always returns OK regardless of whether the email exists (no enumeration).
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // ResetPassword verifies the OTP code and sets a new password.
  // On success all sessions are revoked.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // RequestEmailVerification issues an OTP code to the authenticated user's email.
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  // ConfirmEmail verifies the OTP code and marks the user's email as verified.
  rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);

  // RedeemPromoCode validates and redeems a promo code for the given user,
  // activating a lifetime pro subscription.
  rpc RedeemPromoCode(RedeemPromoCodeRequest) returns (RedeemPromoCodeResponse);
  // GetSubscription returns the current subscription state for a user.
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  // CreateStripeCheckoutSession creates a Stripe Checkout Session and returns
  // the redirect URL. The caller should redirect the user's browser there.
  rpc CreateStripeCheckoutSession(CreateStripeCheckoutSessionRequest) returns (CreateStripeCheckoutSessionResponse);
  // HandleStripeWebhook processes a verified Stripe webhook event.
  // The gateway forwards the raw payload + Stripe-Signature header here;
  // auth-service verifies the signature and updates subscription state.
  rpc HandleStripeWebhook(HandleStripeWebhookRequest) returns (HandleStripeWebhookResponse);
}

// ── Client info ───────────────────────────────────────────────────────────────

// ClientInfo carries HTTP-layer metadata captured by the gateway at login time.
message ClientInfo {
  string ip_address = 1;
  string user_agent = 2;
}

// ── Sign up ──────────────────────────────────────────────────────────────────

message SignUpRequest {
  string email       = 1;
  string password    = 2;
  string name        = 3;
  ClientInfo client_info = 4;
}

message SignUpResponse {
  string user_id      = 1;
  string access_token = 2;
  // refresh_token is returned here so the gateway can set the HttpOnly cookie.
  string refresh_token = 3;
}

// ── Login ────────────────────────────────────────────────────────────────────

message LoginRequest {
  string email       = 1;
  string password    = 2;
  ClientInfo client_info = 3;
}

message LoginResponse {
  string user_id       = 1;
  string access_token  = 2;
  string refresh_token = 3;
}

// ── Refresh ──────────────────────────────────────────────────────────────────

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
}

// ── Logout ───────────────────────────────────────────────────────────────────

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

// ── JWKS ─────────────────────────────────────────────────────────────────────

message GetJWKSRequest {}

// JWK is a JSON Web Key (RFC 7517) in protobuf form.
message JWK {
  string kty = 1; // Key type, e.g. "RSA" or "EC"
  string kid = 2; // Key ID
  string use = 3; // "sig"
  string alg = 4; // e.g. "RS256"
  // RSA public key fields
  string n   = 5; // modulus  (base64url)
  string e   = 6; // exponent (base64url)
}

message GetJWKSResponse {
  repeated JWK keys = 1;
}

// ── Validate ─────────────────────────────────────────────────────────────────

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  string user_id            = 1;
  string email              = 2;
  string session_id         = 3;
  string language           = 4;
  bool   email_verified     = 5;
  string subscription_plan  = 6; // "free" | "pro"
  string time_zone          = 7; // IANA name; "UTC" when unset
}

// ── ListUserIDs ───────────────────────────────────────────────────────────────

message UserSummary {
  string user_id        = 1;
  string email          = 2;
  string name           = 3;
  string language       = 4;
  bool   email_verified = 5;
  string plan           = 6; // "free" | "pro"
  string time_zone      = 7; // IANA name
}

message ListUserIDsRequest {
  // plan_filter restricts results to users on the given plan.
  // Empty string returns all users.
  string plan_filter = 1;
  // page_size caps users per response (default 500, max 1000).
  int32  page_size   = 2;
  // page_token is the previous response's next_page_token; empty starts from the top.
  string page_token  = 3;
}

message ListUserIDsResponse {
  repeated UserSummary users = 1;
  // next_page_token is empty on the last page.
  string next_page_token = 2;
}

// ── GetUserByID ───────────────────────────────────────────────────────────────

message GetUserByIDRequest {
  string user_id = 1;
}

message GetUserByIDResponse {
  UserSummary user = 1;
}

// ── OAuthSignIn ───────────────────────────────────────────────────────────────

message OAuthSignInRequest {
  string provider         = 1; // "google" | "discord"
  string provider_user_id = 2; // stable, provider-issued ID (Google's sub, Discord's id)
  string email            = 3;
  string name             = 4;
  ClientInfo client_info  = 5;
}

message OAuthSignInResponse {
  string user_id       = 1;
  string access_token  = 2;
  string refresh_token = 3;
  bool   created       = 4; // true = new user record
}

// ── Sessions ──────────────────────────────────────────────────────────────────

message Session {
  string id             = 1;
  string browser        = 2;
  string os             = 3;
  string device         = 4;
  string ip_address     = 5;
  google.protobuf.Timestamp created_at      = 6;
  google.protobuf.Timestamp last_active_at  = 7;
  bool   current        = 8;
}

message ListSessionsRequest {
  string user_id            = 1;
  string current_session_id = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message ValidateSessionRequest {
  string session_id = 1;
}

message ValidateSessionResponse {
  bool active = 1;
}

message RevokeSessionRequest {
  string user_id    = 1;
  string session_id = 2;
}

message RevokeSessionResponse {}

message RevokeOtherSessionsRequest {
  string user_id            = 1;
  string current_session_id = 2;
}

message RevokeOtherSessionsResponse {
  int64 revoked = 1;
}

// ── UpdateUserLanguage ────────────────────────────────────────────────────────

message UpdateUserLanguageRequest {
  string user_id  = 1;
  string language = 2;
}

message UpdateUserLanguageResponse {}

// ── UpdateUserTimeZone ────────────────────────────────────────────────────────

message UpdateUserTimeZoneRequest {
  string user_id   = 1;
  string time_zone = 2; // IANA name, e.g. "Asia/Shanghai"
}

message UpdateUserTimeZoneResponse {}

// ── RequestPasswordReset ──────────────────────────────────────────────────────

message RequestPasswordResetRequest {
  string email = 1;
}

// Always OK — no email enumeration.
message RequestPasswordResetResponse {}

// ── ResetPassword ─────────────────────────────────────────────────────────────

message ResetPasswordRequest {
  string email        = 1;
  string code         = 2;
  string new_password = 3;
}

message ResetPasswordResponse {}

// ── RequestEmailVerification ──────────────────────────────────────────────────

message RequestEmailVerificationRequest {
  string user_id = 1;
}

message RequestEmailVerificationResponse {}

// ── ConfirmEmail ──────────────────────────────────────────────────────────────

message ConfirmEmailRequest {
  string user_id = 1;
  string code    = 2;
}

message ConfirmEmailResponse {}

// ── RedeemPromoCode ───────────────────────────────────────────────────────────

message RedeemPromoCodeRequest {
  string user_id = 1;
  string email   = 2; // used to validate user-specific codes
  string code    = 3;
}

message RedeemPromoCodeResponse {
  string plan = 1; // resulting plan after redemption ("pro")
}

// ── GetSubscription ───────────────────────────────────────────────────────────

message GetSubscriptionRequest {
  string user_id = 1;
}

message SubscriptionInfo {
  string plan       = 1; // "free" | "pro"
  string source     = 2; // "promo_code" | "stripe" | ""
  bool   is_active  = 3;
}

message GetSubscriptionResponse {
  SubscriptionInfo subscription = 1;
}

// ── CreateStripeCheckoutSession ───────────────────────────────────────────────

message CreateStripeCheckoutSessionRequest {
  string user_id = 1;
  string email   = 2;
}

message CreateStripeCheckoutSessionResponse {
  string checkout_url = 1;
}

// ── HandleStripeWebhook ───────────────────────────────────────────────────────

message HandleStripeWebhookRequest {
  bytes  payload   = 1; // raw Stripe event body
  string signature = 2; // Stripe-Signature header value
}

message HandleStripeWebhookResponse {}
